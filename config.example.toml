# Copy to config.toml and edit. Paths are relative to this file.

[product]
name = "Halkvakt"
# A couple of sentences so the agent understands what matters. Replace this.
description = """
Halkvakt is a consumer and business app that warns people about slippery roads
and paths. Its core job is to deliver accurate, timely warnings before people
travel. Revenue comes from Premium subscriptions and Business (fleet) plans.
"""
# Optional: standing priorities or rules the team wants applied when ranking.
priorities = """
- Anything that makes warnings late or wrong breaks the core job; treat it as severe.
- Payment problems are P1 or higher.
- Business-plan customers outweigh free users when other factors are equal.
"""

[agent]
model = "claude-opus-5-5"
effort = "high"      # low | medium | high | xhigh | max
max_items = 300      # cap per run to bound cost

# ---- Sources ---------------------------------------------------------------
# Each [[sources]] block is one plug-in. Set enabled = false to skip one.

[[sources]]
name = "bugs"
type = "csv"
channel = "bug_tracker"
path = "sample_data/bugs.csv"
fields = { text = "description", author = "reporter" }
meta = ["labels", "votes"]

[[sources]]
name = "social"
type = "json"
channel = "social"
path = "sample_data/social.json"
items_key = "items"
fields = { author = "user.handle" }
meta = ["platform", "likes", "reposts"]

[[sources]]
name = "support-email"
type = "email"
eml_dir = "sample_data/emails"
# mbox = "exports/support.mbox"
# imap = { host = "imap.gmail.com", user = "support@halkvakt.se", folder = "INBOX", since_days = 14, password_env = "HALKVAKT_IMAP_PASSWORD" }
max_messages = 200

